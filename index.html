            const today = new Date();
            // Force May 2, 2026 for demonstration if today is before
            const refDate = today < startDate ? startDate : today;
            const diffTime = Math.abs(refDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            selectedWeek = Math.min(Math.ceil(diffDays / 7) || 1, 5);
            
            let jsDay = refDate.getDay();
            selectedDay = jsDay; // 0=Sun, 1=Mon...
        }

                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
            lucide.createIcons();
        }

        function getWorkoutExercises(day, week) {
            if (workouts[day].type !== "Força") return workouts[day].exercises;
            
            if (week === 2 && w2Workouts[1]) return w2Workouts[1];
            if (week === 3 && w3Workouts[1]) return w3Workouts[1];
            if (week === 4 && w4Workouts[1]) return w4Workouts[1];
            if (week === 5 && w5Workouts[1]) return w5Workouts[1];
            
            return workouts[day].exercises; // Fallback to week 1
        }

        function renderNutrition() {
            const dayMeals = baseDiet[selectedDay] || baseDiet[1];
            
            let filteredMeals = dayMeals;
            if(dietFilter === 'airfryer') filteredMeals = dayMeals.filter(m => m.airfryer);
            if(dietFilter === 'fish') filteredMeals = dayMeals.filter(m => m.fish);
            if(dietFilter === 'choc') filteredMeals = dayMeals.filter(m => m.choc);

            const html = `
                <div class="mb-4">
                    <h2 class="text-2xl font-bold">Plano Alimentar</h2>
                    <p class="text-sm text-slate-500">Metas ajustadas para a Semana ${selectedWeek}</p>
                </div>

                <!-- Selectors -->
                <div class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-2">
                    ${[1,2,3,4,5].map(w => `
                        <button onclick="setWeek(${w})" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors border ${selectedWeek === w ? 'bg-slate-800 text-white border-slate-800 dark:bg-white dark:text-dark-900 dark:border-white' : 'bg-white text-slate-600 border-slate-200 dark:bg-dark-800 dark:text-slate-300 dark:border-dark-700'}">Semana ${w}</button>
                    `).join('')}
                </div>
                
                <div class="flex gap-2 mb-6 overflow-x-auto hide-scrollbar pb-2">
                    ${[1,2,3,4,5,6,0].map(d => `
                        <button onclick="setDay(${d})" class="px-3 py-2 flex flex-col items-center rounded-xl min-w-[60px] transition-colors border ${selectedDay === d ? 'bg-brand-50 text-brand-700 border-brand-200 dark:bg-brand-900/20 dark:text-brand-400 dark:border-brand-800/50' : 'bg-white text-slate-500 border-slate-200 dark:bg-dark-800 dark:text-slate-400 dark:border-dark-700'}">
                            <span class="text-xs mb-1">${getDayName(d).substring(0,3)}</span>
                        </button>
                    `).join('')}
                </div>

                <!-- Filters -->
                <div class="flex gap-2 mb-4">
                    <button onclick="setFilter('all')" class="px-3 py-1 rounded-full text-xs font-medium ${dietFilter === 'all' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'bg-slate-100 text-slate-500 dark:bg-dark-700 dark:text-slate-400'}">Tudo</button>
                    <button onclick="setFilter('airfryer')" class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1 ${dietFilter === 'airfryer' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' : 'bg-slate-100 text-slate-500 dark:bg-dark-700 dark:text-slate-400'}"><i data-lucide="wind" class="w-3 h-3"></i> Airfryer</button>
                    <button onclick="setFilter('fish')" class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1 ${dietFilter === 'fish' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-slate-100 text-slate-500 dark:bg-dark-700 dark:text-slate-400'}"><i data-lucide="fish" class="w-3 h-3"></i> Peixe</button>
                </div>

                <!-- Timeline -->
                <div class="space-y-4 relative before:absolute before:inset-0 before:ml-4 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 dark:before:via-dark-700 before:to-transparent">
                    ${filteredMeals.length === 0 ? '<p class="text-center text-slate-500 py-8">Nenhuma refeição corresponde ao filtro neste dia.</p>' : ''}
                    
                    ${filteredMeals.map((meal, index) => `
                        <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                            <!-- Timeline Dot -->
                            <div class="flex items-center justify-center w-8 h-8 rounded-full border-4 border-slate-50 dark:border-dark-900 bg-brand-500 text-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10 ml-[2px]">
                                <span class="text-[10px] font-bold">${meal.time.split(':')[0]}</span>
                            </div>
                            
                            <!-- Card -->
                            <div class="w-[calc(100%-3rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl shadow-sm border border-slate-100 dark:border-dark-700 bg-white dark:bg-dark-800 ml-4 md:ml-0 group-odd:mr-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-sm">${meal.name}</h3>
                                    <span class="text-xs font-medium text-slate-400">${meal.time}</span>
                                </div>
                                <ul class="space-y-1">
                                    ${meal.items.map(item => `
                                        <li class="text-xs flex justify-between border-b border-slate-50 dark:border-dark-700/50 pb-1 last:border-0">
                                            <span class="text-slate-600 dark:text-slate-300">${item.n}</span>
                                            <span class="font-medium text-slate-800 dark:text-slate-200 ml-2">${item.q}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                                ${(meal.airfryer || meal.fish || meal.choc) ? `
                                <div class="mt-3 flex gap-1">
                                    ${meal.airfryer ? '<span class="text-[10px] bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="wind" class="w-3 h-3"></i> Airfryer</span>' : ''}
                                    ${meal.fish ? '<span class="text-[10px] bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="fish" class="w-3 h-3"></i> Lata</span>' : ''}
                                    ${meal.choc ? '<span class="text-[10px] bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="heart" class="w-3 h-3"></i> Extra</span>' : ''}
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
            lucide.createIcons();
        }

        function renderWorkout() {
            const todayWorkout = workouts[selectedDay];
            const exercisesList = getWorkoutExercises(selectedDay, selectedWeek);

            const html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold">Treino e Mobilidade</h2>
                    <p class="text-sm text-slate-500">${getDayName(selectedDay)} - Semana ${selectedWeek}</p>
                </div>

                <div class="flex gap-2 mb-6 overflow-x-auto hide-scrollbar pb-2">
                    ${[1,2,3,4,5,6,0].map(d => `
                        <button onclick="setDay(${d})" class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-colors border flex flex-col items-center min-w-[70px] ${selectedDay === d ? 'bg-slate-800 text-white border-slate-800 dark:bg-white dark:text-dark-900 dark:border-white' : 'bg-white text-slate-500 border-slate-200 dark:bg-dark-800 dark:text-slate-400 dark:border-dark-700'}">
                            <span>${getDayName(d).substring(0,3)}</span>
                            <span class="text-[10px] mt-1 opacity-70">${workouts[d].type}</span>
                        </button>
                    `).join('')}
                </div>

                ${isRehearsalDay ? `
                <div class="bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-xl p-5 mb-6">
                    <div class="flex items-center gap-2 mb-3 text-indigo-700 dark:text-indigo-400">
                        <i data-lucide="masks" class="w-5 h-5"></i>
                        <h3 class="font-bold">Rotina de Mobilidade (Ensaio)</h3>
                    </div>
                    <p class="text-xs text-indigo-600 dark:text-indigo-300 mb-3">Fazer 25 minutos antes do ensaio. Não acumular treino pesado hoje se o corpo pedir descanso.</p>
                    <ul class="space-y-2 text-sm text-slate-700 dark:text-slate-300">
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Rotação de ombros: 30s frente + 30s trás</li>
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Abertura torácica (4 apoios): 8 rep/lado</li>
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Hip flexor em afundo: 45s/lado</li>
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Ponte glútea: 3 × 15 rep</li>
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Gato-vaca: 10 ciclos lentos</li>
                        <li class="flex items-start gap-2"><div class="mt-1 w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div> Respiração diafragmática: 2 min</li>
                    </ul>
                </div>
                ` : ''}

                <div class="bg-white dark:bg-dark-800 rounded-xl shadow-sm border border-slate-100 dark:border-dark-700 overflow-hidden">
                    <div class="bg-slate-50 dark:bg-dark-900 p-4 border-b border-slate-100 dark:border-dark-700">
                        <div class="flex items-center gap-2">
                            ${todayWorkout.type === 'Força' ? '<i data-lucide="dumbbell" class="text-brand-500 w-5 h-5"></i>' : 
                              todayWorkout.type === 'Cardio' ? '<i data-lucide="activity" class="text-brand-500 w-5 h-5"></i>' : 
                              '<i data-lucide="bed-double" class="text-slate-400 w-5 h-5"></i>'}
                            <h3 class="font-bold text-lg">${todayWorkout.type}</h3>
                        </div>
                    </div>
                    <div class="p-4">
                        <ul class="space-y-4">
                            ${exercisesList.map((ex, i) => `
                                <li class="flex gap-3 items-start">
                                    <div class="w-6 h-6 rounded bg-slate-100 dark:bg-dark-700 flex items-center justify-center text-xs font-bold text-slate-500 shrink-0 mt-0.5">${i+1}</div>
                                    <span class="text-sm font-medium text-slate-700 dark:text-slate-300 leading-snug">${ex}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
            lucide.createIcons();
        }

        function renderShopping() {
            const html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold">Compras e Orçamento</h2>
                    <p class="text-sm text-slate-500">Teto máximo: 90€/mês | Real: ~82,78€</p>
                </div>

                <div class="bg-brand-50 dark:bg-brand-900/20 border border-brand-200 dark:border-brand-800 rounded-xl p-4 mb-6 flex gap-3">
                    <i data-lucide="check-circle" class="text-brand-500 shrink-0"></i>
                    <div>
                        <p class="text-sm text-brand-800 dark:text-brand-300"><b>Regras:</b> Proteína base são ovos. Sem laticínios, sem bebidas vegetais, sem oleaginosas (caras). Frango max 2x/semana.</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <!-- Mensal -->
                    <div>
                        <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> Compras Mensais Fixas</h3>
                        <div class="bg-white dark:bg-dark-800 rounded-xl shadow-sm border border-slate-100 dark:border-dark-700 overflow-hidden">
                            <ul class="divide-y divide-slate-100 dark:divide-dark-700">
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="droplet" class="w-4 h-4 text-slate-400"></i>Azeite virgem extra 1L</span> <span class="font-medium">5,85€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="wheat" class="w-4 h-4 text-slate-400"></i>Aveia 1kg</span> <span class="font-medium">3,00€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="package" class="w-4 h-4 text-slate-400"></i>Arroz branco 2kg</span> <span class="font-medium">2,66€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="package" class="w-4 h-4 text-slate-400"></i>Lentilhas secas 1kg</span> <span class="font-medium">2,14€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="fish" class="w-4 h-4 text-slate-400"></i>Atum pack 6×60g</span> <span class="font-medium">4,42€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="fish" class="w-4 h-4 text-slate-400"></i>Sardinha lata × 4</span> <span class="font-medium">3,96€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="heart" class="w-4 h-4 text-slate-400"></i>Chocolate negro 75% × 2</span> <span class="font-medium">2,38€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-slate-400"></i>Feijão e Grão lata × 5</span> <span class="font-medium">4,45€</span></li>
                            </ul>
                            <div class="bg-slate-50 dark:bg-dark-900 p-3 text-right text-xs font-bold text-slate-500">Subtotal: ~28,86€</div>
                        </div>
                    </div>

                    <!-- Semanal -->
                    <div>
                        <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="shopping-basket" class="w-4 h-4"></i> Compras Semanais (Frescos)</h3>
                        <div class="bg-white dark:bg-dark-800 rounded-xl shadow-sm border border-slate-100 dark:border-dark-700 overflow-hidden">
                            <ul class="divide-y divide-slate-100 dark:divide-dark-700">
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="egg" class="w-4 h-4 text-slate-400"></i>Ovos 12 un</span> <span class="font-medium">1,29€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="drumstick" class="w-4 h-4 text-slate-400"></i>Peito frango 250g</span> <span class="font-medium">2,34€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="banana" class="w-4 h-4 text-slate-400"></i>Banana 1kg</span> <span class="font-medium">1,20€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="apple" class="w-4 h-4 text-slate-400"></i>Maçã 1kg</span> <span class="font-medium">1,50€</span></li>
                                <li class="p-3 flex justify-between text-sm"><span class="flex items-center gap-2"><i data-lucide="carrot" class="w-4 h-4 text-slate-400"></i>Vegetais variados (Cenoura, Tomate, Curgete, Espinafre, Batata)</span> <span class="font-medium">6,21€</span></li>
                            </ul>
                            <div class="bg-slate-50 dark:bg-dark-900 p-3 text-right text-xs font-bold text-slate-500">Subtotal: ~12,54€ / semana</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
            lucide.createIcons();
        }

        // --- INTERACTIVITY ---

        function switchTab(tabId) {
            currentTab = tabId;
            
            // Update UI
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.tab === tabId) {
                    btn.classList.add('text-brand-500');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-brand-500');
                    btn.classList.add('text-slate-400');
                }
            });

            // Render content
            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'diet') renderNutrition();
            if (tabId === 'workout') renderWorkout();
            if (tabId === 'shopping') renderShopping();
            
            window.scrollTo(0, 0);
        }

        function toggleRehearsal() {
            isRehearsalDay = !isRehearsalDay;
            if(currentTab === 'dashboard') renderDashboard();
            if(currentTab === 'workout') renderWorkout();
        }

        function setWeek(w) {
            selectedWeek = w;
            if(currentTab === 'diet') renderNutrition();
            if(currentTab === 'workout') renderWorkout();
        }

        function setDay(d) {
            selectedDay = d;
            if(currentTab === 'diet') renderNutrition();
            if(currentTab === 'workout') renderWorkout();
        }

        function setFilter(f) {
            dietFilter = f;
            renderNutrition();
        }

        function setupTheme() {
            const html = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            
            // Default dark based on your request, but allow toggle
            const toggleTheme = () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    themeIcon.setAttribute('data-lucide', 'sun');
                } else {
                    html.classList.add('dark');
                    themeIcon.setAttribute('data-lucide', 'moon');
                }
                lucide.createIcons();
            };

            themeToggle.addEventListener('click', toggleTheme);
            lucide.createIcons();
        }

        // Boot
        init();

    </script>
</body>
</html>
